<!doctype html>
<html lang="ko">
<head>
<title>윷놀이</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="윷놀이">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
    --me:#D9483B;
    --cpu:#3B7BD9;
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .btn:disabled{opacity:.35;cursor:default}
  .seg{display:flex;align-items:center;gap:6px}
  .seg .lbl{color:var(--ink-dim);font-size:17px;padding-right:2px;white-space:nowrap}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .stage{position:absolute;inset:0}
  #board{position:absolute;left:0;top:0;display:block;touch-action:none}
  /* 오른쪽: 윷 던지기 · 결과 · 말 */
  .panel{
    position:absolute;top:0;right:0;bottom:0;width:var(--pw);display:flex;flex-direction:column;gap:12px;
    padding:12px 14px 14px;background:var(--bar);border-left:1px solid var(--line)
  }
  .gear{align-self:flex-end;min-height:54px;padding:0 22px;font-size:20px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .turn{font-size:22px;font-weight:700;text-align:center}
  .turn.me{color:#F28C80}
  .turn.cpu{color:#8DB5F2}
  .sticks{display:flex;justify-content:center;gap:10px;height:96px;align-items:center}
  .stick{width:24px;height:92px;border-radius:12px;background:#B9874A;border:2px solid #6E4A1F;position:relative;transition:transform .25s}
  .stick.flat{background:#F2E3C4}
  .stick.flat::before,.stick.flat::after{content:"";position:absolute;left:50%;width:12px;height:2px;background:#6E4A1F;transform:translateX(-50%) rotate(45deg)}
  .stick.flat::before{top:30%}
  .stick.flat::after{top:30%;transform:translateX(-50%) rotate(-45deg)}
  .stick.spin{transform:rotateX(180deg)}
  .result{text-align:center;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:64px;line-height:1;color:var(--brass);min-height:64px}
  .say{text-align:center;color:var(--ink);font-size:19px;min-height:52px}
  .throw{min-height:96px;font-size:32px;border-radius:18px}
  .trays{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .tray{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--ink-dim)}
  .tray .who{width:64px;font-weight:700}
  .tray i{width:22px;height:22px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.4)}
  .tray i.out{opacity:.25}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto;z-index:3}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <canvas id="board" role="img" aria-label="윷판"></canvas>
    <aside class="panel" id="panel">
      <button id="gear" class="btn gear" type="button">설정</button>
      <div class="turn me" id="turn">어머니 차례</div>
      <div class="sticks" id="sticks"><span class="stick"></span><span class="stick"></span><span class="stick"></span><span class="stick"></span></div>
      <div class="result" id="result"></div>
      <div class="say" id="say">「윷 던지기」를 눌러요</div>
      <button id="throw" class="btn primary throw" type="button">윷 던지기</button>
      <div class="trays">
        <div class="tray"><span class="who" style="color:#F28C80">어머니</span><span id="trayMe"></span></div>
        <div class="tray"><span class="who" style="color:#8DB5F2">컴퓨터</span><span id="trayCpu"></span></div>
      </div>
    </aside>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <div id="count" class="seg wide" role="group" aria-label="말 수">
            <span class="lbl">말</span>
            <button class="btn" type="button" data-v="2" aria-pressed="true">2개</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">3개</button>
            <button class="btn" type="button" data-v="4" aria-pressed="false">4개</button>
          </div>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="again" class="btn" type="button">처음부터</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note">윷을 던진 뒤 움직일 말을 누르면 노란 점까지 가요. 윷·모가 나오거나 상대 말을 잡으면 한 번 더 던져요. 말이 다 나가면 이겨요.</p>
        <button id="menuClose" class="btn primary" type="button">닫고 하기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2 id="dTitle">이겼어요!</h2>
        <button id="doneAgain" class="btn primary" type="button">한 판 더</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $('#board'), ctx = cv.getContext('2d'), stage = $('#stage'), panel = $('#panel');
  const turned = matchMedia('(orientation: portrait)');
  const PREFS = 'yut.prefs';
  const NAMES = ['', '도', '개', '걸', '윷', '모'];

  // ---------- 윷판 ----------
  // 바깥 20칸: 출발(오른쪽 아래)에서 위로 → 왼쪽 → 아래로 → 오른쪽으로 돌아온다. 지름길 a(오른쪽 위→왼쪽 아래), b(왼쪽 위→출발)
  const POS = {};
  for (let i = 1; i <= 19; i++){
    let x, y;
    if (i <= 5){ x = 1; y = 1 - i/5; }
    else if (i <= 10){ x = 1 - (i-5)/5; y = 0; }
    else if (i <= 15){ x = 0; y = (i-10)/5; }
    else { x = (i-15)/5; y = 1; }
    POS['o' + i] = [x, y];
  }
  POS.S = [1, 1];
  POS.a1 = [5/6, 1/6]; POS.a2 = [4/6, 2/6]; POS.c = [.5, .5]; POS.a3 = [2/6, 4/6]; POS.a4 = [1/6, 5/6];
  POS.b1 = [1/6, 1/6]; POS.b2 = [2/6, 2/6]; POS.b3 = [4/6, 4/6]; POS.b4 = [5/6, 5/6];
  const outerFrom = n => { const r = []; for (let i = n; i <= 19; i++) r.push('o' + i); return r.concat('OUT'); };
  function route(node){
    if (node === 'home') return outerFrom(1);
    if (node === 'o5') return ['a1', 'a2', 'c', 'a3', 'a4'].concat(outerFrom(15));
    if (node === 'o10') return ['b1', 'b2', 'c', 'b3', 'b4', 'OUT'];
    if (node === 'c') return ['b3', 'b4', 'OUT'];
    if (node === 'a1') return ['a2', 'c', 'a3', 'a4'].concat(outerFrom(15));
    if (node === 'a2') return ['c', 'a3', 'a4'].concat(outerFrom(15));
    if (node === 'a3') return ['a4'].concat(outerFrom(15));
    if (node === 'a4') return outerFrom(15);
    if (node === 'b1') return ['b2', 'c', 'b3', 'b4', 'OUT'];
    if (node === 'b2') return ['c', 'b3', 'b4', 'OUT'];
    if (node === 'b3') return ['b4', 'OUT'];
    if (node === 'b4') return ['OUT'];
    return outerFrom(+node.slice(1) + 1);
  }
  // k칸 갈 때 지나는 칸들 (마지막이 도착 칸, 'OUT'이면 나감)
  function path(node, k){ const r = route(node); return r.slice(0, Math.min(k, r.length)); }

  // ---------- 게임 상태 ----------
  let prefs = { count: 2, sound: true };
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));

  let G = null;
  function newGame(){
    G = { pcs: { me: Array(prefs.count).fill('home'), cpu: Array(prefs.count).fill('home') },
          turn: 'me', phase: 'throw', roll: 0, anim: null, over: false };
    $('#done').hidden = true; $('#menu').hidden = true;
    $('#result').textContent = '';
    setSticks(null);
    syncPanel('「윷 던지기」를 눌러요');
    draw();
  }
  const other = w => w === 'me' ? 'cpu' : 'me';
  // 움직일 수 있는 무리: 같은 칸에 업힌 말은 함께 간다. 집에 있는 말은 한 무리로 본다
  function options(who, k){
    const seen = new Set(), out = [];
    G.pcs[who].forEach((p, i) => {
      if (p === 'out' || seen.has(p)) return;
      seen.add(p);
      const idx = G.pcs[who].map((q, j) => q === p ? j : -1).filter(j => j >= 0);
      const steps = path(p, k);
      out.push({ from: p, idx: p === 'home' ? [idx[0]] : idx, steps, to: steps[steps.length - 1] });
    });
    return out;
  }

  // ---------- 윷 던지기 ----------
  // 윷가락 하나가 평평한 면(배)이 나올 확률 0.6 — 실제 윷과 비슷하게 개·걸이 자주, 모는 드물게
  function rollSticks(){
    const flats = [0, 1, 2, 3].map(() => Math.random() < .6);
    const n = flats.filter(Boolean).length;
    return { flats, k: n === 0 ? 5 : n };
  }
  function setSticks(flats, spin){
    [...$('#sticks').children].forEach((s, i) => {
      s.classList.toggle('flat', !!(flats && flats[i]));
      s.classList.toggle('spin', !!spin);
    });
  }
  function doThrow(){
    if (!G || G.over || G.phase !== 'throw' || G.anim) return;
    wakeAudio();
    G.phase = 'rolling';
    $('#throw').disabled = true;
    $('#result').textContent = '';
    let t = 0;
    const spin = setInterval(() => { setSticks([0,1,2,3].map(() => Math.random() < .5), t++ % 2); beep(300 + Math.random()*200, .03); }, 90);
    setTimeout(() => {
      clearInterval(spin);
      const r = rollSticks();
      setSticks(r.flats, false);
      G.roll = r.k;
      $('#result').textContent = NAMES[r.k] + '!';
      beep(r.k >= 4 ? 880 : 620, .15);
      G.phase = 'move';
      const ops = options(G.turn, r.k);
      if (G.turn === 'me'){
        syncPanel(r.k >= 4 ? `${NAMES[r.k]}! 말을 옮기고 한 번 더 던져요` : '움직일 말을 눌러요');
        G.ops = ops; draw();
      } else {
        G.ops = ops; draw();
        setTimeout(() => cpuMove(ops), 700);
      }
    }, 800);
  }

  // ---------- 말 옮기기 ----------
  function move(op){
    const who = G.turn, k = G.roll;
    G.phase = 'anim'; G.ops = null;
    const steps = op.steps.slice();
    let i = 0;
    G.anim = { who, idx: op.idx, at: op.from };
    const tick = () => {
      if (i < steps.length){
        G.anim.at = steps[i++];
        beep(500, .04); draw();
        setTimeout(tick, 230);
        return;
      }
      const to = steps[steps.length - 1];
      G.anim = null;
      for (const j of op.idx) G.pcs[who][j] = to === 'OUT' ? 'out' : to;
      let caught = false;
      if (to !== 'OUT'){
        const opp = other(who);
        G.pcs[opp] = G.pcs[opp].map(p => { if (p === to){ caught = true; return 'home'; } return p; });
      }
      draw();
      if (G.pcs[who].every(p => p === 'out')) return finish(who);
      let msg;
      if (caught){ beep(988, .2); msg = who === 'me' ? '잡았어요! 한 번 더 던져요' : '컴퓨터가 잡았어요'; }
      else if (to === 'OUT'){ beep(784, .18); msg = who === 'me' ? '말이 나갔어요!' : '컴퓨터 말이 나갔어요'; }
      const again = caught || k >= 4;
      if (!again) G.turn = other(who);
      G.phase = 'throw';
      syncPanel(msg || (G.turn === 'me' ? (again ? '한 번 더 던져요' : '「윷 던지기」를 눌러요') : '컴퓨터 차례예요'));
      if (G.turn === 'cpu') setTimeout(doThrow, 1000);
    };
    tick();
  }
  // 컴퓨터: 잡을 수 있으면 잡고, 나갈 수 있으면 나가고, 아니면 가장 멀리 간 말이나 새 말
  function cpuMove(ops){
    const opp = G.pcs.me;
    const score = op => {
      let s = 0;
      if (op.to === 'OUT') s += 50*op.idx.length;
      if (op.to !== 'OUT' && opp.includes(op.to)) s += 100;
      if (['o5', 'o10', 'c'].includes(op.to)) s += 15;
      if (op.from === 'home') s += 8;
      if (G.pcs.cpu.includes(op.to)) s += 6; // 업기
      return s + Math.random()*10;
    };
    ops.sort((a, b) => score(b) - score(a));
    move(ops[0]);
  }
  function finish(who){
    G.over = true;
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    syncPanel(who === 'me' ? '다 나갔어요!' : '컴퓨터 말이 다 나갔어요');
    setTimeout(() => {
      $('#dTitle').textContent = who === 'me' ? '이겼어요!' : '컴퓨터가 이겼어요';
      $('#done').hidden = false;
    }, 1000);
  }

  // ---------- 그리기 ----------
  let W = 0, H = 0, B = 0, BX = 0, BY = 0, dpr = 1;
  function layout(){
    W = stage.clientWidth; H = stage.clientHeight;
    const pw = Math.round(Math.min(340, Math.max(250, W*.27)));
    stage.style.setProperty('--pw', pw + 'px');
    // 판 둘레 테두리와 판 아래 「새 말」 자리까지 화면 안에 들어오게
    const aw = W - pw;
    B = Math.min(aw/1.24, H/1.32);
    BX = (aw - B)/2; BY = (H - B*1.2)/2 + B*.08;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(aw*dpr); cv.height = Math.round(H*dpr);
    cv.style.width = aw + 'px'; cv.style.height = H + 'px';
    draw();
  }
  const P = n => n === 'OUT' ? [BX + B + B*.09, BY + B + B*.09] : [BX + POS[n][0]*B, BY + POS[n][1]*B];
  const big = n => ['S', 'o5', 'o10', 'o15', 'c'].includes(n);
  function piece(x, y, r, color, n, glow){
    ctx.save();
    if (glow){ ctx.shadowColor = '#FFD66E'; ctx.shadowBlur = 18; }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x + 2, y + 4, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
    if (n > 1){
      ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(r*1.1)}px "IBM Plex Sans KR",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(n, x, y + 1);
    }
    ctx.restore();
  }
  function draw(){
    if (!G || !B) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#1F2A3C'; ctx.fillRect(0, 0, W, H);
    // 판
    ctx.fillStyle = '#E9D9B4';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(BX - B*.07, BY - B*.07, B*1.14, B*1.14, 18) : ctx.rect(BX - B*.07, BY - B*.07, B*1.14, B*1.14); ctx.fill();
    ctx.strokeStyle = '#8A6A3A'; ctx.lineWidth = 3;
    ctx.strokeRect(BX, BY, B, B);
    ctx.beginPath(); ctx.moveTo(BX, BY); ctx.lineTo(BX + B, BY + B); ctx.moveTo(BX + B, BY); ctx.lineTo(BX, BY + B); ctx.stroke();
    const sr = B*.032;
    for (const n of Object.keys(POS)){
      const [x, y] = P(n), r = big(n) ? sr*1.6 : sr;
      ctx.fillStyle = big(n) ? '#C9A46A' : '#F7EEDB';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#8A6A3A'; ctx.stroke();
    }
    ctx.fillStyle = '#6E4A1F'; ctx.font = `700 ${Math.round(B*.035)}px "IBM Plex Sans KR",sans-serif`; ctx.textAlign = 'center';
    ctx.fillText('출발', BX + B, BY + B + B*.065 + 4);
    // 가는 곳 미리 보기 (노란 점)
    const pr = B*.042;
    if (G.ops && G.turn === 'me'){
      for (const op of G.ops){
        const [x, y] = P(op.to);
        ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 4; ctx.strokeStyle = '#FFD66E';
        ctx.beginPath(); ctx.arc(x, y, pr*1.15, 0, Math.PI*2); ctx.stroke(); ctx.restore();
        if (op.to === 'OUT'){ ctx.fillStyle = '#FFD66E'; ctx.font = `700 ${Math.round(B*.03)}px "IBM Plex Sans KR",sans-serif`; ctx.fillText('나감', x, y + 6); }
      }
    }
    // 말
    for (const who of ['cpu', 'me']){
      const groups = {};
      G.pcs[who].forEach((p, i) => {
        if (G.anim && G.anim.who === who && G.anim.idx.includes(i)) return;
        if (p === 'home' || p === 'out') return;
        (groups[p] = groups[p] || []).push(i);
      });
      for (const [n, idx] of Object.entries(groups)){
        const [x, y] = P(n), off = who === 'cpu' && G.pcs.me.includes(n) ? pr*.5 : 0;
        const glow = G.turn === 'me' && who === 'me' && G.ops && G.ops.some(o => o.from === n);
        piece(x + off, y - off, pr, who === 'me' ? '#D9483B' : '#3B7BD9', idx.length, glow);
      }
    }
    if (G.anim){
      const [x, y] = P(G.anim.at);
      piece(x, y - pr*.3, pr*1.1, G.anim.who === 'me' ? '#D9483B' : '#3B7BD9', G.anim.idx.length, true);
    }
    // 집에 있는 말: 판 아래 왼쪽 — 눌러서 새 말을 놓는다
    const homeN = who => G.pcs[who].filter(p => p === 'home').length;
    const hx = BX - B*.02, hy = BY + B + B*.16;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ECE5D3'; ctx.font = `700 ${Math.round(B*.032)}px "IBM Plex Sans KR",sans-serif`;
    const n = homeN('me');
    if (n){
      const glow = G.turn === 'me' && G.ops && G.ops.some(o => o.from === 'home');
      piece(hx + pr, hy, pr*.9, '#D9483B', n, glow);
      ctx.fillStyle = '#ECE5D3'; ctx.fillText('새 말', hx + pr*2.2, hy + 7);
    }
    syncTrays();
  }
  function syncTrays(){
    for (const [who, el] of [['me', '#trayMe'], ['cpu', '#trayCpu']]){
      $(el).innerHTML = G.pcs[who].map(p => `<i class="${p === 'out' ? 'out' : ''}" style="background:${who === 'me' ? '#D9483B' : '#3B7BD9'}"></i>`).join(' ');
    }
  }
  function syncPanel(msg){
    const t = $('#turn');
    t.textContent = G.turn === 'me' ? '어머니 차례' : '컴퓨터 차례';
    t.className = 'turn ' + G.turn;
    $('#say').textContent = msg;
    $('#throw').disabled = !(G.turn === 'me' && G.phase === 'throw' && !G.over);
  }

  // ---------- 누르기 ----------
  cv.addEventListener('pointerdown', e => {
    if (!G || G.turn !== 'me' || G.phase !== 'move' || !G.ops) return;
    const r = cv.getBoundingClientRect();
    const x = turned.matches ? e.clientY - r.top : e.clientX - r.left;
    const y = turned.matches ? r.right - e.clientX : e.clientY - r.top;
    const pr = B*.042, hx = BX - B*.02 + pr, hy = BY + B + B*.16;
    let best = null, bestD = Infinity;
    for (const op of G.ops){
      // 말이 있는 칸이나 갈 곳(노란 점) 어느 쪽을 눌러도 된다
      const pts = [op.from === 'home' ? [hx, hy] : P(op.from), P(op.to)];
      for (const [px, py] of pts){
        const d = Math.hypot(px - x, py - y);
        if (d < pr*2 && d < bestD){ best = op; bestD = d; }
      }
    }
    if (best){ wakeAudio(); move(best); }
  });

  // ---------- 소리 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.2, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }

  // ---------- 설정 ----------
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  function syncSeg(){ for (const b of $('#count').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.count); }
  $('#count').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.count) return;
    prefs.count = +b.dataset.v; savePrefs(); syncSeg(); newGame();
  });
  $('#throw').addEventListener('click', doThrow);
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#again').addEventListener('click', newGame);
  $('#doneAgain').addEventListener('click', newGame);
  $('#gear').addEventListener('click', () => { $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
    } catch(e){}
    $('#menu').hidden = true;
  });

  toggle($('#sound'), prefs.sound); syncSeg();
  newGame();
  new ResizeObserver(layout).observe(stage);
  layout();
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
